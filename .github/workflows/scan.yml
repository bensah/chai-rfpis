name: Weekly RFP scan

# Runs the donor-source scanner with the Playwright "deep read" enabled — which
# can't run on Streamlit Community Cloud (no Chromium, memory-capped). This job
# installs Chromium and writes new RFPs straight to the same Supabase the live
# app reads, so accurate, deeply-read opportunities appear there.
#
# ONE-TIME SETUP: add two repository secrets under
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     SUPABASE_URL   (same value the app uses)
#     SUPABASE_KEY   (service-role key, or anon if RLS write policies are in place)
# Then trigger manually via the "Run workflow" button, or wait for the weekly run.

on:
  schedule:
    - cron: "0 6 * * 5"          # Fridays 06:00 UTC
  workflow_dispatch: {}          # manual "Run workflow" button

concurrency:
  group: rfp-scan
  cancel-in-progress: false      # never interrupt an in-flight scan mid-write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scan (deep read enabled)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Serper (real Google) powers the aggregator→source resolver. Optional:
          # without it the resolver simply no-ops and DevelopmentAid hits stay as
          # listings. Add SERPER_API_KEY as a repo Actions secret to enable it.
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # …and now also powers the WEB-SEARCH DISCOVERY sweep (--discover below).
          # Tavily is an optional SECOND provider for that sweep: either alone works, and
          # both together improve recall. Add TAVILY_API_KEY as a repo Actions secret to
          # enable it. Set RFPIS_SEARCH_DISCOVERY=0 to switch the sweep off without
          # touching the command.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Multi-tenant: lets the per-tenant screening step treat the run as multi-tenant.
          # Optional — the --screen-tenants override works without it — but keeps the
          # app's tenant state consistent. Add SUPABASE_JWT_SECRET as a repo Actions secret.
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          # LLM synthesis + judging. WITHOUT these the cron stores RAW scraped preamble as
          # the brief (unformatted PDF dumps) and skips LLM budget/geo/theme extraction —
          # exactly the "raw brief" symptom. Point at an OpenAI-compatible endpoint (e.g.
          # Ollama Cloud). LLM_SYNTH_* fall back to LLM_JUDGE_* in code, so setting the
          # JUDGE pair alone enables BOTH; set the SYNTH pair too to use a different model.
          LLM_JUDGE_BASE_URL: ${{ secrets.LLM_JUDGE_BASE_URL }}
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
          LLM_JUDGE_MODEL: ${{ secrets.LLM_JUDGE_MODEL }}
          LLM_SYNTH_BASE_URL: ${{ secrets.LLM_SYNTH_BASE_URL }}
          LLM_SYNTH_API_KEY: ${{ secrets.LLM_SYNTH_API_KEY }}
          LLM_SYNTH_MODEL: ${{ secrets.LLM_SYNTH_MODEL }}
          # THE PROVIDER CHAIN, WHICH THIS WORKFLOW DID NOT HAVE (added 2026-11-19).
          #
          # Everything above is the LEGACY single-endpoint arrangement: one base URL, one
          # key, one model. `core/llm_client` has had multi-vendor failover for a while —
          # `RFPIS_LLM_PROVIDERS` names a chain and `_provider_fallback` walks it when the
          # first vendor errors — but none of those variables were passed here, so the
          # weekly scan has been running with NO chain and NO fallback. When its single
          # endpoint rate-limited, synthesis dropped straight to regex, silently: measured
          # on a TED run, 11 of 26 rows came back with no description at all.
          #
          # With the chain, Cerebras absorbs the normal load and Ollama is the fallback,
          # which is what makes a small Ollama balance last — it is only spent when
          # Cerebras is throttled. Proven locally 2026-11-19: a forced Cerebras failure
          # fell through and Ollama answered.
          #
          # Both are no-ops until the secrets exist, so this is safe to merge before they
          # are added — the scan simply keeps using the legacy endpoint alone.
          RFPIS_LLM_PROVIDERS: ${{ vars.RFPIS_LLM_PROVIDERS || 'cerebras,ollama' }}
          RFPIS_LLM_CEREBRAS_API_KEY: ${{ secrets.RFPIS_LLM_CEREBRAS_API_KEY }}
          # PER-RUN SPEND CEILING. Measured 2026-11-19: one synthesis call is ~5,670
          # tokens (4,061 prompt + 1,609 completion). Real intake over the last ten weekly
          # scans was 32-117 new rows, median ~55 — roughly 312k tokens a week.
          #
          # The code default is 400 calls, about 2.27M tokens: seven times a normal week,
          # so it guards against nothing that actually happens and would let one runaway
          # unattended Friday run spend a whole prepaid balance. 150 covers every week
          # observed (max 117) with headroom and bounds the worst case to ~850k tokens.
          # Raise it with a repo variable if a week genuinely needs more.
          LLM_SYNTH_STORE_MAX_CALLS: ${{ vars.LLM_SYNTH_STORE_MAX_CALLS || '150' }}
          # New-opportunity email (core/pipeline_digest.py): after each tenant is screened,
          # members are emailed the new Proceed / Park calls. Same Resend sender as the app's
          # account emails — add RESEND_API_KEY and RESEND_FROM_EMAIL as repo Actions secrets
          # with the app's values. APP_PUBLIC_URL is the fallback for the links if the
          # app_public_url setting is not stored in the database.
          # Without the Resend pair the scan still runs and the email is skipped.
          # OFF until switched on: set the repo VARIABLE RFPIS_PIPELINE_DIGEST to 1. While
          # testing, also set RFPIS_PIPELINE_DIGEST_TO to a comma-separated list of addresses
          # so only they receive it; leave it empty to email every member.
          RFPIS_PIPELINE_DIGEST: ${{ vars.RFPIS_PIPELINE_DIGEST || '0' }}
          RFPIS_PIPELINE_DIGEST_TO: ${{ vars.RFPIS_PIPELINE_DIGEST_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          RFPIS_DEEP_READ: "1"
          SCAN_INCLUDE_SEEDS: "1"
          SCAN_PARALLELISM: "6"
        # Option-C multi-tenant discovery: crawl → SHARED extracted store (--extract-only),
        # then auto-screen EACH active tenant into its own pipeline (--screen-tenants).
        #
        # --discover adds a WEB-SEARCH sweep alongside the crawl. The registry is
        # donor-keyed, so it cannot reach a call published on a partner's programme
        # microsite under the programme's name rather than the funder's own domain — three
        # live calls were lost to exactly that and found only because someone shared a
        # link. Search does not care whose domain a call sits on. Its hits go through the
        # same gates, enrichment and store write as a crawled candidate; ~14 queries per
        # provider per run, so about 1,500 Serper queries a year against a 2,500 free tier.
        run: python scripts/run_scan.py --triggered-by cron --extract-only --screen-tenants --discover
