# Eligibility scoring weights. Each criterion is scored as
#   Yes = 1.0, Partial = 0.5, No = 0.0, null = 0.0 (unscored).
# Weights must sum to 1.0; alignment_score = sum(weight_i * value_i) * 100.
qualification:    0.15
strategic_fit:     0.15
capacity:     0.15
geographic_fit:         0.10
cofinancing:        0.10
funding_quality: 0.08
funder_relationship:     0.08
competitiveness:     0.10
bid_effort:           0.09

# Auto-recommendation thresholds (applied after decline-flag override).
#
# 90/70, matching auto_scorer.recommend_from_composite, which calls itself THE canonical
# auto-decision rule and is what every live display already bands by.
#
# These were 70/45, and that was a leftover rather than a judgement (owner, 2026-10-27).
# The composite used to be 80% criteria + 20% donor-org extras; when the extras were
# dropped as duplicative (2026-06-29, matching.EXTRAS_WEIGHT = 0.00) the number changed
# meaning, auto_scorer was retuned to 90/70 and these were not. The result: the SAME
# 0-100 score banded two ways depending on how a row entered the app. A row scoring 75
# read Park if the scan found it and Proceed if someone submitted it by hand. Measured
# on live data at the time of the change, 95 of 266 rows banded differently between the
# two rules, and 65 carried a stored recommendation that disagreed with the canonical one.
thresholds:
  proceed: 90
  park:    70
